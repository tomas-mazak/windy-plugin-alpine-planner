<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="720" height="330" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="bold" fill="#222">Temperature at any height, for one grid node and one step</text>
  <!-- axes: x = 80 + (T + 35) * 12 ; y = 290 - h * 0.04 -->
  <line x1="80" y1="290" x2="620" y2="290" stroke="#444"/>
  <line x1="80" y1="290" x2="80" y2="44" stroke="#444"/>
  <text x="300" y="318" fill="#444">temperature (°C)</text>
  <text x="80" y="305" text-anchor="middle" fill="#444">−35</text>
  <text x="320" y="305" text-anchor="middle" fill="#444">−15</text>
  <text x="500" y="305" text-anchor="middle" fill="#444">0</text>
  <text x="620" y="305" text-anchor="middle" fill="#444">+10</text>
  <text x="72" y="294" text-anchor="end" fill="#444">0 m</text>
  <text x="72" y="214" text-anchor="end" fill="#444">2000 m</text>
  <text x="72" y="134" text-anchor="end" fill="#444">4000 m</text>
  <text x="72" y="54" text-anchor="end" fill="#444">6000 m</text>
  <line x1="500" y1="290" x2="500" y2="44" stroke="#1f6fd1" stroke-dasharray="3,4"/>
  <!-- model terrain 1200 m -->
  <rect x="80" y="242" width="540" height="48" fill="#7a5230" fill-opacity="0.08"/>
  <line x1="80" y1="242" x2="620" y2="242" stroke="#7a5230" stroke-width="1.5"/>
  <text x="560" y="237" fill="#7a5230">model terrain z_s</text>
  <!-- profile inside: (1200,-2) (1500,-4) (3050,-14) (5600,-30) -->
  <polyline points="476,242 452,230 332,168 140,66" fill="none" stroke="#222" stroke-width="2.5"/>
  <circle cx="476" cy="242" r="4.5" fill="#222"/>
  <circle cx="452" cy="230" r="4" fill="#222"/>
  <circle cx="332" cy="168" r="4" fill="#222"/>
  <circle cx="140" cy="66" r="4" fill="#222"/>
  <text x="468" y="256" text-anchor="end" fill="#222">T2m</text>
  <text x="462" y="226" fill="#222">850 hPa</text>
  <text x="342" y="164" fill="#222">700 hPa</text>
  <text x="150" y="62" fill="#222">500 hPa (top)</text>
  <text x="350" y="118" fill="#222">② inside the profile: linear between points</text>
  <!-- below: extrapolate with Γ from lowest 500 m: to h=400, T=+3.3 -->
  <line x1="476" y1="242" x2="540" y2="274" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="7,4"/>
  <text x="420" y="270" text-anchor="end" fill="#b3261e">① below z_s: free air at 6.5 K/km,</text>
  <text x="420" y="284" text-anchor="end" fill="#b3261e">T2m's offset fading out over 300 m</text>
  <!-- above top: 6.5 K/km -->
  <line x1="140" y1="66" x2="109" y2="50" stroke="#1f6fd1" stroke-width="2.5" stroke-dasharray="7,4"/>
  <text x="150" y="44" fill="#1f6fd1">③ above the top: −6.5 K/km</text>
  <!-- height bands -->
  <g stroke="#2e9b4f" stroke-width="1.5">
    <line x1="636" y1="282" x2="648" y2="282"/><line x1="636" y1="266" x2="648" y2="266"/>
    <line x1="636" y1="250" x2="648" y2="250"/><line x1="636" y1="234" x2="648" y2="234"/>
    <line x1="636" y1="218" x2="648" y2="218"/><line x1="636" y1="202" x2="648" y2="202"/>
    <line x1="636" y1="186" x2="648" y2="186"/><line x1="636" y1="170" x2="648" y2="170"/>
    <line x1="636" y1="154" x2="648" y2="154"/><line x1="636" y1="138" x2="648" y2="138"/>
    <line x1="636" y1="122" x2="648" y2="122"/><line x1="636" y1="106" x2="648" y2="106"/>
    <line x1="636" y1="90" x2="648" y2="90"/>
  </g>
  <text x="654" y="94" fill="#2e9b4f">height</text>
  <text x="654" y="108" fill="#2e9b4f">bands</text>
  <text x="654" y="122" fill="#2e9b4f">h_k</text>
</svg>
